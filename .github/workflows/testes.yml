name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --target lib -r requirements.txt
      - run: python -m compileall -q -x lib .
      - run: python -m unittest discover -s tests -v
