; ============================================================
; Envio de Contracheques - configuração
; Regras avançadas. O dia a dia é ajustado na aba Configurações do programa.
; ============================================================

[geral]
; Como identificar o colaborador pelo NOME DO ARQUIVO:
;   nome   -> "Maria Silva_Recibo de Salário 09.2026.pdf" (casa com a coluna NOME)
;   codigo -> "1234_MARIA.pdf" (casa com a coluna CODIGO)
identificar_por = nome

; Regex aplicada ao nome do arquivo (sem .pdf). O 1º grupo é o nome.
; Maria_Silva_Recibo_de_Salário_09_2026_-_Empresa-18 -> "Maria_Silva" (o "_" vira espaço)
padrao_nome_arquivo = ^(.+?)_Recibo

; Usado só se identificar_por = codigo. O 1º grupo é o código.
padrao_codigo_arquivo = ^(\d+)

; Competência no nome do arquivo: grupo 1 = mês, grupo 2 = ano (09_2026, 09.2026, 09-2026).
; Arquivo de competência diferente da selecionada na tela é BLOQUEADO.
padrao_competencia_arquivo = (\d{2})[._\-/ ](\d{4})

; Opcional: só processa arquivos cujo nome contenha este padrão (regex, sem diferenciar maiúsculas).
; Ex.: Recibo de Sal  -> ignora férias, 13º etc. que estiverem na mesma pasta. Vazio = todos.
filtro_arquivo =

; Conferência do conteúdo do recibo (recomendado: sim)
conferir_conteudo_pdf = sim

; Lê o CÓDIGO e o NOME impressos no cabeçalho do recibo (layout atual da folha).
; Os dois precisam bater com a planilha, senão o item é BLOQUEADO.
; Grupo 1 = código, grupo 2 = nome. Deixe vazio para a busca genérica (menos segura).
regex_cabecalho_pdf = (\d+)\s*\n\s*C[óo]digo\s*\n\s*([^\n]+?)\s*\n\s*Nome do Funcion

; Confere "Setembro de 2026" dentro do recibo contra a competência selecionada
conferir_competencia_pdf = sim

; Só vale na busca genérica (regex_cabecalho_pdf vazio)
conferir_codigo_no_pdf = sim

; Composição da senha do PDF. Marcadores:
;   {cpf4}       -> 4 últimos dígitos do CPF (coluna CPF_FINAL)
;   {nasc_ddmm}  -> dia e mês de nascimento (coluna DATA_NASC)
; Exemplos: {cpf4}   |   {cpf4}{nasc_ddmm}
formato_senha = {cpf4}

; Pausa entre e-mails (segundos). Exchange Online limita ~30 mensagens/minuto.
pausa_segundos = 2

; Move o PDF original para <pasta>\Enviados\AAAA-MM após envio real
mover_enviados = sim

[email]
; ------------------------------------------------------------------
; Os campos abaixo são ajustados pela aba CONFIGURAÇÕES do programa,
; que grava em configuracoes.ini (esse arquivo tem prioridade).
; A senha de e-mail NUNCA fica em arquivo de texto: vai para o cofre
; do Windows (credencial.dat, criptografado por usuário/máquina).
; ------------------------------------------------------------------
; outlook | smtp | simulado
modo_envio = simulado
remetente =
assunto = Contracheque {tipo_folha} {competencia} - {nome}
nome_empresa = Empresa Demo

[tema]
; Logo exibida no topo do programa e no ícone da janela.
; Coloque o arquivo na pasta do programa (PNG com fundo transparente, ~200 px de altura).
logo = logo.png

; sim = a cor principal da tela e do e-mail é extraída da própria logo.
; nao = usa as cores abaixo.
cores_da_logo = sim

; Cores usadas quando não há logo ou cores_da_logo = nao (hexadecimal #RRGGBB)
cor_primaria = #0E3B5C
cor_destaque = #1FA2B8
cor_fundo = #F2F4F7
